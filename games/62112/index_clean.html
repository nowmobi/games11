<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Modern Sudoku</title>
  <link rel="stylesheet" href="styles.css">

    <style>
      /* 隐藏所有广告容器 */
      #imaContainer,
      #imaContainer_new,
      #sdk__advertisement,
      #gmLoadingText,
      iframe[src*="imasdk"],
      iframe[src*="doubleclick"],
      iframe[src*="googlesyndication"],
      iframe[title="Advertisement"],
      div[id*="google_ads"],
      div[id*="aswift"] {
        display: none !important;
        visibility: hidden !important;
        opacity: 0 !important;
        pointer-events: none !important;
      }
    </style>
    <script>
      // 定期清除动态插入的广告元素
      setInterval(function() {
        var adSelectors = [
          '#imaContainer',
          '#imaContainer_new', 
          '#sdk__advertisement',
          '#gmLoadingText',
          'iframe[src*="imasdk"]',
          'iframe[src*="doubleclick"]',
          'iframe[src*="googlesyndication"]',
          'iframe[title="Advertisement"]',
          'div[id*="google_ads"]',
          'div[id*="aswift"]'
        ];
        
        adSelectors.forEach(function(selector) {
          var elements = document.querySelectorAll(selector);
          elements.forEach(function(el) {
            if (el && el.parentNode) {
              el.parentNode.removeChild(el);
            }
          });
        });

        // 阻止广告SDK函数
        if (window.sdk_init) window.sdk_init = function() {};
        if (window.sdk) window.sdk = { showBanner: function() {}, requestAd: function() {} };
        if (window.adBreak) window.adBreak = function() {};
        if (window.adConfig) window.adConfig = function() {};
      }, 500);
    </script>

  </head>
<body>

  <div class="container">
    <h1>Modern Sudoku</h1>
    <div class="game-grid" id="game-grid"></div>
    <button id="reset-button">New Game</button>
  </div>

  <!-- Win Screen -->
  <div id="win-screen" class="overlay hidden">
    <h2>🎉 Congratulations! You Win! 🎉</h2>
    <button id="play-again-button">Play Again</button>
  </div>

  <!-- Draw Screen -->
  <div id="draw-screen" class="overlay hidden">
    <h2>😞 It's a Draw! 😞</h2>
    <button id="retry-button">Try Again</button>
  </div>

  <!-- GameMonetize SDK -->
  <script type="text/javascript">
    window.SDK_OPTIONS = {
      gameId: "3rlvhqpnhkz5zaoxhe7yxy4a8mk9adee", // Replace with your actual GameMonetize game ID
      onEvent: function (event) {
        switch (event.name) {
          case "SDK_GAME_PAUSE":
            console.log("Game Paused for Ad");
            break;
          case "SDK_GAME_START":
            console.log("Ad Finished, Resume Game");
            break;
          case "SDK_READY":
            console.log("SDK Ready");
            break;
          case "SDK_ERROR":
            console.error("SDK Error:", event.message);
            break;
        }
      }
    };
    (function (d, s, id) {
      var js, fjs = d.getElementsByTagName(s)[0];
      if (!d.getElementById(id)) {
        js = d.createElement(s);
        js.id = id;
        js.src = "https://api.gamemonetize.com/sdk.js";
        fjs.parentNode.insertBefore(js, fjs);
      }
    })(document, "script", "gamemonetize-sdk");
  </script>

  <script src="script.js"></script>
</body>
</html>
