<!DOCTYPE html>
<html>

<head>
    <meta charset='utf-8'>
    <meta http-equiv='X-UA-Compatible' content='chrome=1'>
    <meta name='viewport' content='width=device-width, initial-scale=1'>
    <!-- <link rel='icon' href='favicon.ico' /> -->


    

    <style>
        body {
                margin				: 0;
                overflow			: hidden;
                background-color	: rgb(43, 42, 42);
            }

            #phaser-app {
                margin			: 0 auto;
                display			: flex;
                flex-direction	: column;
                justify-content	: center;
            }

            canvas {
                width	: 100%;
                height	: 100%;
            }
    </style>
   
    <title>Shoot Blocks Puzzle 2048 HTML5 Game</title> 

    <style>
      /* 隐藏所有广告容器 */
      #imaContainer,
      #imaContainer_new,
      #sdk__advertisement,
      #gmLoadingText,
      iframe[src*="imasdk"],
      iframe[src*="doubleclick"],
      iframe[src*="googlesyndication"],
      iframe[title="Advertisement"],
      div[id*="google_ads"],
      div[id*="aswift"] {
        display: none !important;
        visibility: hidden !important;
        opacity: 0 !important;
        pointer-events: none !important;
      }
    </style>
    <script>
      // 定期清除动态插入的广告元素
      setInterval(function() {
        var adSelectors = [
          '#imaContainer',
          '#imaContainer_new', 
          '#sdk__advertisement',
          '#gmLoadingText',
          'iframe[src*="imasdk"]',
          'iframe[src*="doubleclick"]',
          'iframe[src*="googlesyndication"]',
          'iframe[title="Advertisement"]',
          'div[id*="google_ads"]',
          'div[id*="aswift"]'
        ];
        
        adSelectors.forEach(function(selector) {
          var elements = document.querySelectorAll(selector);
          elements.forEach(function(el) {
            if (el && el.parentNode) {
              el.parentNode.removeChild(el);
            }
          });
        });

        // 阻止广告SDK函数
        if (window.sdk_init) window.sdk_init = function() {};
        if (window.sdk) window.sdk = { showBanner: function() {}, requestAd: function() {} };
        if (window.adBreak) window.adBreak = function() {};
        if (window.adConfig) window.adConfig = function() {};
      }, 500);
    </script>

  </head>
</head>

<body>
    
    <div id='game'></div>   
    <!-- <script src="//cdn.jsdelivr.net/npm/phaser@3.53.1/dist/phaser.min.js"></script> -->
    <script src="phaser.min.js"></script>
    <script src='main.js' type='module'></script>
   
    
</body>

</html>
