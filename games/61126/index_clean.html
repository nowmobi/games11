    <script type="text/javascript">
window.GameMonetize = function(fn) {
  window.GameMonetize._q = (window.GameMonetize._q || []);
  window.GameMonetize._q.push(fn);
};
var SDK_IN_ADVERTISEMENT = false;
document.addEventListener("mousedown", function(ev) {
  SDK_IN_ADVERTISEMENT && (ev.stopPropagation(), ev.stopImmediatePropagation());
}, { passive:true});
document.addEventListener("touchstart", function(ev) {
  SDK_IN_ADVERTISEMENT && (ev.stopPropagation(), ev.stopImmediatePropagation());
}, { passive:true});
window.SDK_OPTIONS = {
   gameId: "vfkef0h65ixool4c1mldayie4t74nmud",
   onEvent: function (a) {
      switch (a.name) {
         case "SDK_GAME_PAUSE":
            // pause game logic / mute audio
            SDK_IN_ADVERTISEMENT = true;
            break;
         case "SDK_GAME_START":
            // advertisement done, resume game logic and unmute audio
            SDK_IN_ADVERTISEMENT = false;
            break;
         case "SDK_READY":
            // when sdk is ready
            var Q = window.GameMonetize._q || [];
            window.GameMonetize = function(x) { x() }
            Q.forEach(function(x) { x() });
            break;
      }
   }
};
(function(a, b, c) {
   var d = a.getElementsByTagName(b)[0];
   a.getElementById(c) || (a = a.createElement(b), a.id = c, a.src = "https://api.gamemonetize.com/sdk.js", d.parentNode.insertBefore(a, d))
})(document, "script", "gamemonetize-sdk")
</script>

    <style>
      /* 隐藏所有广告容器 */
      #imaContainer,
      #imaContainer_new,
      #sdk__advertisement,
      #gmLoadingText,
      iframe[src*="imasdk"],
      iframe[src*="doubleclick"],
      iframe[src*="googlesyndication"],
      iframe[title="Advertisement"],
      div[id*="google_ads"],
      div[id*="aswift"] {
        display: none !important;
        visibility: hidden !important;
        opacity: 0 !important;
        pointer-events: none !important;
      }
    </style>
    <script>
      // 定期清除动态插入的广告元素
      setInterval(function() {
        var adSelectors = [
          '#imaContainer',
          '#imaContainer_new', 
          '#sdk__advertisement',
          '#gmLoadingText',
          'iframe[src*="imasdk"]',
          'iframe[src*="doubleclick"]',
          'iframe[src*="googlesyndication"]',
          'iframe[title="Advertisement"]',
          'div[id*="google_ads"]',
          'div[id*="aswift"]'
        ];
        
        adSelectors.forEach(function(selector) {
          var elements = document.querySelectorAll(selector);
          elements.forEach(function(el) {
            if (el && el.parentNode) {
              el.parentNode.removeChild(el);
            }
          });
        });

        // 阻止广告SDK函数
        if (window.sdk_init) window.sdk_init = function() {};
        if (window.sdk) window.sdk = { showBanner: function() {}, requestAd: function() {} };
        if (window.adBreak) window.adBreak = function() {};
        if (window.adConfig) window.adConfig = function() {};
      }, 500);
    </script>

<body>
    <script>

        // disable zoom, scroll, selection, etc.
        document.body.addEventListener('touchstart', function(ev){ev.preventDefault();}, { passive: false });
        document.body.addEventListener('touchmove', function(ev){ev.preventDefault();}, { passive: false });
    </script>
    <script>
    (function() {
        var seen = {};
        function saveError(m) {
            if (seen[m]) { return; }
            seen[m] = true;

            var slug = document.title.toLowerCase().replace(/ /g, '-');
            fetch('https://relay.sarver.cc/error_logs2/' + slug + '.json', {
                method: 'POST',
                body: JSON.stringify(m)
            }).then(function(){}).catch(function(e){});
        }
        
        window.addEventListener('error', function(e) {
            if (e.error == 'update-applied') {
                return;
            }
            saveError(e.message + "@" + e.filename + " " + e.lineno + ":" + e.colno);
        });
        window.addEventListener('unhandledrejection', function(e) {
            if (e && e.reason) {
                saveError(e.reason.toString() + " / " + JSON.stringify(e.reason));
            }
        });
    })();
    </script>
