<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>X-O Battle</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="game-container">
        <h1>X-O Battle</h1>
        <div id="board">
            <div class="cell" data-index="0"></div>
            <div class="cell" data-index="1"></div>
            <div class="cell" data-index="2"></div>
            <div class="cell" data-index="3"></div>
            <div class="cell" data-index="4"></div>
            <div class="cell" data-index="5"></div>
            <div class="cell" data-index="6"></div>
            <div class="cell" data-index="7"></div>
            <div class="cell" data-index="8"></div>
        </div>
        <button id="reset-btn">New Game</button>
    </div>

    <!-- Result Screen -->
    <div id="result-screen">
        <h2 id="result-message"></h2>
        <button id="play-again">Play Again</button>
    </div>

    <!-- GameMonetize SDK Initialization -->
    <script type="text/javascript">
        window.SDK_OPTIONS = {
            gameId: "yeqh7inen60dcrtwluqfcgp1bubl7god", // Replace with your GameMonetize game ID
            onEvent: function (event) {
                switch (event.name) {
                    case "SDK_GAME_PAUSE":
                        gameActive = false; // Pause game
                        break;
                    case "SDK_GAME_START":
                        gameActive = true;  // Resume game
                        break;
                    case "SDK_READY":
                        console.log("GameMonetize SDK is ready");
                        break;
                    case "SDK_ERROR":
                        console.error("GameMonetize SDK encountered an error");
                        break;
                }
            }
        };

        (function (d, s, id) {
            var js, fjs = d.getElementsByTagName(s)[0];
            if (d.getElementById(id)) { return; }
            js = d.createElement(s);
            js.id = id;
            js.src = "https://api.gamemonetize.com/sdk.js";
            fjs.parentNode.insertBefore(js, fjs);
        }(document, "script", "gamemonetize-sdk"));
    </script>

    <script src="script.js"></script>
</body>
</html>
